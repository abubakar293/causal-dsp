name: Bug Report
description: Report a bug, causality leakage, or invariant violation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please verify your bug is reproducible on the latest release.
  - type: input
    id: version
    attributes:
      label: causal-dsp Version
      description: What version of causal-dsp are you running? (e.g. 0.1.0)
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: Clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Minimal Python code demonstrating the issue or causality violation.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
